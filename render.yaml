databases:
  - name: chambard-db
    databaseName: chambard
    user: chamba_user
    plan: free
    region: ohio

services:
  - type: web
    name: chamba-rd-api
    env: python
    plan: free
    region: ohio
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "gunicorn backend.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chambard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "43200"
      - key: ENVIRONMENT
        value: "production"
      - key: DEFAULT_COMMISSION_RATE
        value: "0.10"
